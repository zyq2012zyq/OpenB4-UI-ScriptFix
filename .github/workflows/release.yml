name: Build and publish RavenB4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build release JAR
        shell: pwsh
        run: .\tools\build-release.ps1 -Jdk8Home $env:JAVA_HOME_8_X64 -Jdk17Home $env:JAVA_HOME_17_X64
      - name: Prepare release notes
        shell: pwsh
        run: |
          $body = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($body, '(?ms)^## (.+?)\r?\n(.*?)(?=^## |\z)')
          if (-not $match.Success) { throw 'CHANGELOG.md has no release entry' }
          $match.Value | Set-Content -Path release-notes.md -Encoding utf8
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" "dist/RavenB4.jar#RavenB4.jar" --title "RavenB4 build ${{ github.run_number }}" --notes-file release-notes.md --latest
